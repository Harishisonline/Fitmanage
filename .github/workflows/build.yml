name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: fitmanage_test
          MYSQL_USER: fitmanage
          MYSQL_PASSWORD: testpw
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      db.url: jdbc:mysql://127.0.0.1:3306/fitmanage_test
      db.user: fitmanage
      db.password: testpw
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: mvn -B -DskipTests package
      - name: Test
        run: mvn -B test
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: fitmanage-jar
          path: target/fitmanage-*.jar
          if-no-files-found: error
